name: Docker Build & Push

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (failed builds only)
        if: failure() == false && github.event_name == 'pull_request'
        run: docker version

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            docker-compose.yml
            .env.example
            LICENSE
          body: |
            ## 本版本镜像

            使用固定版本标签，便于确认部署版本；`latest` 可能随后续默认分支构建更新。

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ## 首次部署

            需要 Docker 和 curl。创建部署目录并下载本版本的环境变量示例：

            ```bash
            mkdir -p nvidia2api
            cd nvidia2api
            curl --fail --location "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.example" --output .env
            ```

            编辑 `.env`，修改 `ADMIN_PASSWORD`、`ADMIN_TOKEN` 和 `SECRET_KEY`，然后启动：

            ```bash
            docker run -d --name nvidia2api \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env \
              -e DATA_DIR=/app/data \
              -e DATABASE_PATH=/app/data/db.sqlite3 \
              -v "$(pwd)/data:/app/data" \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            - 管理后台：`http://服务器地址:3000`，使用 `ADMIN_PASSWORD` 登录。
            - OpenAI 兼容 API 地址：`http://服务器地址:3000/v1`。在后台导入 NVIDIA Key、启用模型并创建用户 API Key 后即可调用。
            - 数据保存在当前目录的 `data/` 中；升级时请备份 `.env` 和 `data/`，拉取新版本镜像并重建容器，继续挂载原数据目录。

            [完整部署文档](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/deployment.md)。附带的 `docker-compose.yml` 使用 `build: .`，仅适用于完整源码目录中的本地构建，不能单独下载并用于运行发布镜像。
