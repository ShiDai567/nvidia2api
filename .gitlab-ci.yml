stages:
  - build

variables:
  IMAGE: $CI_REGISTRY_IMAGE/nvidia2api
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_BUILDKIT: "1"

docker-build:
  stage: build
  image:
    name: docker:27-cli
    pull_policy: if-not-present
  services:
    - name: docker:27-dind
      alias: docker
      pull_policy: if-not-present
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      # 确定镜像 tag：Tag 推送用 Tag 名，分支推送用分支名 + latest(默认分支)
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="--tag $IMAGE:$CI_COMMIT_TAG --tag $IMAGE:latest"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="--tag $IMAGE:$CI_COMMIT_SHORT_SHA --tag $IMAGE:latest"
      else
        SAFE_BRANCH=$(echo "$CI_COMMIT_BRANCH" | tr '/-' '__')
        TAGS="--tag $IMAGE:$SAFE_BRANCH --tag $IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
      echo "Building with tags: $TAGS"
      docker build --pull --cache-from "$IMAGE:latest" \
        $TAGS \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        .
      docker push --all-tags "$IMAGE"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

