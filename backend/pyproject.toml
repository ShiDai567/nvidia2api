[project]
name = "nvidia2api-backend"
version = "0.1.0"
description = "NVIDIA2API Django backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.0",
    "django-filter>=24.0",
    "httpx[socks]>=0.27",
    "httpx-socks>=0.10",
    "socksio>=1.0",
    "pydantic>=2.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
